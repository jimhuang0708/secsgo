<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel=stylesheet type="text/css" href="static/css/host.css">
    <meta charset="UTF-8">
    <title>Host Control Panel</title>
</head>

<body>
    <h1>Host Control Panel</h1>

    <fieldset>
        <legend>Start Host</legend>
        <label>
            <input type="radio" name="mode" value="ACTIVE" id="modeactive" checked> ACTIVE
        </label>
        <label>
            <input type="radio" name="mode" value="PASSIVE" id="modepassive"> PASSIVE
        </label>
        <input type="text" id="remoteip" style="height:25px;width:150px" value="" ></input>
        <button type="button" id="btnConnect">Connect</button>
    </fieldset>


    <!-- 第二組：四個按鈕 -->
    <fieldset>
        <legend>Online Control</legend>
        <div class="button-group">
            <button type="button" id="btnOnlineRequest">Host request online </button>
            <button type="button" id="btnOfflineRequest">Host request offline</button>
        </div>
    </fieldset>

    <!-- 第三組：三個 slider -->
    <fieldset>
        <legend>Content</legend>
        <div class="sv-container">
            <!-- 左邊：textarea -->
            <div class="sv-left">
                <textarea id="sv-textarea" readonly></textarea>
            </div>
            <!-- 右邊：按鈕區（可捲動） -->
            <div class="sv-right">
                <div class="sv-buttons">
                    <button type="button" id="cleartext" >Clear text</button>
                    <div>
                        <button type="button" id="s1f3" style="width:50%">(S1F3)Selected Equipment Status</button> 
                        <input type="text" id="s1f3_param" style="height:25px;width:45%" value="1006,1007,1008"></input>
                    </div>
                    <div>
                        <button type="button" id="s1f11" style="width:50%">(S1F11)Status Variable Namelist</button>
                        <input type="text" id="s1f11_param" style="height:25px;width:45%" value="1006,1007,1008"></input>
                     </div>
                    <div>
                        <button type="button" id="s2f13" style="width:50%">(S2F13)Equipment Constant</button>
                        <input type="text" id="s2f13_param" style="height:25px;width:45%" value="1206,1207,1208"></input>
                    </div>
                    <div>
                        <button type="button" id="s2f15" style="width:50%">(S2F15)Set Equipment Constant</button>
                        <input type="text" id="s2f15_param" style="height:25px;width:45%" value="1206=10,1207=11,1208=12"></input>
                    </div>
                    <div>
                        <button type="button" id="s2f29" style="width:50%">(S2F29)Equipment Constant Namelist </button>
                        <input type="text" id="s2f29_param" style="height:25px;width:45%" value="1206,1207,1208"></input>
                    </div> 
                    <button type="button">Button 4</button>
                    <button type="button">Button 5</button>
                    <button type="button">Button 66</button>
                    <button type="button">Button 7</button>
                    <button type="button">Button 8</button>
                </div>
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Chat</legend>
        From Equipment : <p id="chatbox"> </p>
        <button type="button" id="s10f3">(S10F3)SendText</button><input type="text" id="sendtextcontent" style="margin:10px" value="How are you?">
    </fieldset>

    <fieldset>
        <legend>Remote Command</legend>
        <button type="button" id="s2f41">(S2F41)SendRemoteCommand</button>
    </fieldset>
    <fieldset>
        <legend>Trace Data Collection</legend>
        <div>
            <button type="button" id="s2f23" style="height:25px;width:300px">(S2F23)Trace Initialize Send</button>
            TRID&nbsp  <input type="number" id="s2f23_trid" style="height:25px;width:50px" value=1>
            DSPER&nbsp<input type="text" id="s2f23_dsper" style="height:25px;width:50px" value="000001"></input>
            TOTSMP&nbsp<input type="number" id="s2f23_totsmp" style="height:25px;width:50px" value=10 >
            REPGSZ&nbsp<input type="number" id="s2f23_repgsz" style="height:25px;width:50px" value=2>
            VIDs&nbsp<input type="text" id="s2f23_vids" style="height:25px;width:45%" value="1006,1007,1008"></input>
        </div>
    </fieldset>
    <fieldset>
        <legend>Report define & link</legend>
        <div>
            <button type="button" id="s2f33" style="height:25px;width:300px">(S2F33)Define Report
            </button><input type="text" id="defrptid" style="margin:10px" value="8888">
            </button><input type="text" id="defrptvidlst" style="margin:10px" value="1007,1008"> <br>
            <button type="button" id="s2f35" style="height:25px;width:300px">(S2F35)Link Report To Event</button>
            </button><input type="text" id="linkevtid" style="margin:10px" value="300">
            </button><input type="text" id="linkrptid" style="margin:10px" value="8888"> <br>
        </div>
    </fieldset>

    <fieldset>
        <legend>Limit monitor</legend>
        <button type="button" id="s2f45">(S2F45)Define Variable Limit Attributes</button>
        <button type="button" id="s2f47">(S2F47)Variable Limit Attribute Request</button>
    </fieldset>
    <fieldset>
        <legend>DataSet read/write</legend>
        <button type="button" id="readeq"> (STREAM13)Read</button>
        <button type="button" id="writeeq">(STREAM13)Write</button>
    </fieldset>

    <fieldset>
         <legend>Free Build Secs</legend>
        <div class="mb-3">
            <label>Stream</label>
            <input id="streamInput" type="number" class="form-control" value="1">
        </div>
        <div class="mb-3">
           <label>Function</label>
            <input id="functionInput" type="number" class="form-control" value="3">
        </div>
        <hr>
        <h5>Data Item</h5>
        <div id="rootContainer"></div>
        <hr>
        <div style="display:none">
            <h5 class="mt-4">Load JSON → UI</h5>
            <textarea id="jsonInput" class="form-control" rows="8" placeholder="Paste JSON here..."></textarea>
            <button id="loadBtn" class="btn btn-success mt-2">Load JSON</button>
        </div>
        <pre id="output" class="bg-dark text-light p-3 mt-3" style="min-height:300px;"></pre>
        <button id="generateBtn" class="btn btn-primary mt-3">Generate JSON & Send to Equipment</button>
    </fieldset>


    <div id="status">WebSocket: <span id="wsState">Connecting…</span></div>
    <script type="text/javascript" src="static/js/host.js"></script>
</body>
</html>
